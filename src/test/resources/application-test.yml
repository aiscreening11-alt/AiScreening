  review-threshold: 60.0
  weights:
    skills: 40.0
    experience: 20.0
    education: 10.0
    keywords: 10.0
    responsibilities: 10.0
    certifications: 5.0
    resumeQuality: 5.0
  scoring-weights:
    rule-based-weight: 0.70
    ai-weight: 0.30
