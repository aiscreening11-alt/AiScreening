spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:prefer}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${RECRUITMENT_EMAIL:aayushkumarlashkari8@gmail.com}}
    password: ${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:https://aiscreening.onrender.com}}

logging:
  level:
    root: INFO
    com.company.recruitment: INFO

gmail:
  enabled: true
  polling:
    interval: 60000
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:https://aiscreening.onrender.com/api/v1/gmail/oauth2callback}
  tokens-directory-path: ./tokens
  recruitment-email: ${RECRUITMENT_EMAIL:aayushkumarlashkari8@gmail.com}
