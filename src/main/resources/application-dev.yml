spring:
  config:
    import:
      - optional:file:./application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recruitment_db}?sslmode=${DB_SSL_MODE:prefer}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${RECRUITMENT_EMAIL:aayushkumarlashkari8@gmail.com}}
    password: ${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:https://aiscreening.onrender.com}}

ai:
  provider: mock
  enabled: true

gmail:
  enabled: true
  polling:
    interval: 60000
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/gmail/oauth2callback}
  tokens-directory-path: ./tokens
  recruitment-email: ${RECRUITMENT_EMAIL:aayushkumarlashkari8@gmail.com}
